# ==============================================================================
# NGINX CONFIGURATION FOR IS-SITEPA 2026
# International Symposium on Sustainable Infrastructure, Transportation,
# Environment, Planning, and Architecture (FT UNHAS x UTM)
# ==============================================================================
# File ini disimpan di: /etc/nginx/sites-available/is-sitepa
# Lalu diaktifkan dengan: sudo ln -s /etc/nginx/sites-available/is-sitepa /etc/nginx/sites-enabled/
# ==============================================================================

server {
    listen 80;
    listen [::]:80;

    # Ganti dengan nama domain resmi kampus atau IP server Anda
    server_name is-sitepa.unhas.ac.id www.is-sitepa.unhas.ac.id;

    # Lokasi root direktori file web yang di-upload
    root /var/www/is-sitepa;
    index index.html;

    # Pengaturan Header Keamanan (Security Headers)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --------------------------------------------------------------------------
    # 1. Routing Utama Single Page Application (React / Vite)
    # --------------------------------------------------------------------------
    # try_files sangat penting agar saat pengunjung membuka link atau me-refresh
    # halaman browser (F5), server tidak merespon dengan 404 Not Found.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --------------------------------------------------------------------------
    # 2. Cache Aset Statis (Gambar, CSS, JS, Fonts)
    # --------------------------------------------------------------------------
    # File build Vite menggunakan content-hash sehingga aman di-cache 1 tahun
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;
    }

    # --------------------------------------------------------------------------
    # 3. Kompresi Gzip untuk Kecepatan Loading Maksimal
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # --------------------------------------------------------------------------
    # 4. Keamanan: Blokir Akses ke File Tersembunyi (.git, .env, dll)
    # --------------------------------------------------------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Log Akses dan Error
    access_log /var/log/nginx/is-sitepa_access.log;
    error_log /var/log/nginx/is-sitepa_error.log;
}
